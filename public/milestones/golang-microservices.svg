<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="go-bg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#041824"/>
      <stop offset="50%" stop-color="#072b40"/>
      <stop offset="100%" stop-color="#020d14"/>
    </linearGradient>
    <filter id="go-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#00add8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" rx="16" fill="url(#go-bg)"/>
  
  <!-- Subtle Grid -->
  <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600" stroke="#00add8" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M100 0 V340 M200 0 V340 M300 0 V340 M400 0 V340 M500 0 V340" stroke="#00add8" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Window Header Bar -->
  <rect x="24" y="20" width="552" height="34" rx="8" fill="#08314a" fill-opacity="0.6" stroke="#0284c7" stroke-opacity="0.3"/>
  <circle cx="44" cy="37" r="4.5" fill="#ef4444" fill-opacity="0.8"/>
  <circle cx="58" cy="37" r="4.5" fill="#eab308" fill-opacity="0.8"/>
  <circle cx="72" cy="37" r="4.5" fill="#10b981" fill-opacity="0.8"/>
  <text x="94" y="41" fill="#bae6fd" font-family="monospace" font-size="11" letter-spacing="1">GOLANG ENGINE // HIGH-CONCURRENCY MICROSERVICES</text>
  <rect x="430" y="27" width="134" height="20" rx="10" fill="#00add8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4"/>
  <circle cx="442" cy="37" r="3" fill="#38bdf8"/>
  <text x="452" y="41" fill="#e0f2fe" font-family="monospace" font-size="9" font-weight="bold">GOROUTINES: 12,500</text>

  <!-- Left: Concurrency & Throughput Metrics -->
  <g transform="translate(40, 75)" filter="url(#go-glow)">
    <rect width="260" height="185" rx="12" fill="#072a3e" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="18" y="26" fill="#7dd3fc" font-family="monospace" font-size="10" letter-spacing="1">THROUGHPUT SPEED</text>
    <text x="18" y="56" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="bold">18,450 <tspan font-size="12" fill="#38bdf8">REQ/S</tspan></text>
    
    <!-- P99 Latency Badge -->
    <rect x="18" y="70" width="135" height="22" rx="11" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <circle cx="28" cy="81" r="3" fill="#34d399"/>
    <text x="36" y="85" fill="#a7f3d0" font-family="monospace" font-size="9" font-weight="bold">p99 LATENCY: 1.2ms</text>

    <!-- Concurrency Pipes -->
    <g transform="translate(18, 108)">
      <text x="0" y="12" fill="#7dd3fc" font-family="monospace" font-size="9">POSTGRES POOL: 64/64 POOLED</text>
      <rect x="0" y="18" width="224" height="6" rx="3" fill="#0c4a6e"/>
      <rect x="0" y="18" width="210" height="6" rx="3" fill="#38bdf8"/>

      <text x="0" y="42" fill="#7dd3fc" font-family="monospace" font-size="9">REDIS L1 CACHE HIT RATE: 99.4%</text>
      <rect x="0" y="48" width="224" height="6" rx="3" fill="#0c4a6e"/>
      <rect x="0" y="48" width="220" height="6" rx="3" fill="#10b981"/>
    </g>
  </g>

  <!-- Right: REST Endpoint Telemetry -->
  <g transform="translate(320, 75)">
    <rect width="240" height="185" rx="12" fill="#072a3e" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="18" y="26" fill="#7dd3fc" font-family="monospace" font-size="10" letter-spacing="1">REST PIPELINE DISPATCH</text>
    
    <!-- Endpoint 1 -->
    <rect x="14" y="38" width="212" height="38" rx="8" fill="#0a3954" stroke="#0369a1" stroke-width="1"/>
    <text x="24" y="54" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">POST</text>
    <text x="60" y="54" fill="#ffffff" font-family="monospace" font-size="10">/api/v2/order/create</text>
    <text x="24" y="68" fill="#7dd3fc" font-family="monospace" font-size="9">200 OK · 0.8ms</text>

    <!-- Endpoint 2 -->
    <rect x="14" y="86" width="212" height="38" rx="8" fill="#0a3954" stroke="#0369a1" stroke-width="1"/>
    <text x="24" y="102" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">GET</text>
    <text x="54" y="102" fill="#ffffff" font-family="monospace" font-size="10">/api/v2/catalog/live</text>
    <text x="24" y="116" fill="#7dd3fc" font-family="monospace" font-size="9">Cached (Redis) · 0.2ms</text>

    <!-- Endpoint 3 -->
    <rect x="14" y="134" width="212" height="38" rx="8" fill="#0a3954" stroke="#0369a1" stroke-width="1"/>
    <text x="24" y="150" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">PUT</text>
    <text x="54" y="150" fill="#ffffff" font-family="monospace" font-size="10">/api/v2/settlement</text>
    <text x="24" y="164" fill="#7dd3fc" font-family="monospace" font-size="9">ACID Committed · 2.1ms</text>
  </g>

  <!-- Bottom Terminal Bar -->
  <rect x="24" y="280" width="552" height="38" rx="8" fill="#031622" stroke="#0284c7" stroke-opacity="0.25"/>
  <text x="40" y="303" fill="#7dd3fc" font-family="monospace" font-size="10">> GOLANG // DISTRIBUTED WORKERS RUNNING AT PEAK CONCURRENCY</text>
  <text x="500" y="303" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">● READY</text>
</svg>
