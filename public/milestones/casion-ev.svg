<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ev-bg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#031a12"/>
      <stop offset="50%" stop-color="#072b1f"/>
      <stop offset="100%" stop-color="#020d09"/>
    </linearGradient>
    <linearGradient id="ev-emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="ev-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" rx="16" fill="url(#ev-bg)"/>
  
  <!-- Subtle Grid Pattern -->
  <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600" stroke="#10b981" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M100 0 V340 M200 0 V340 M300 0 V340 M400 0 V340 M500 0 V340" stroke="#10b981" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Window Header Bar -->
  <rect x="24" y="20" width="552" height="34" rx="8" fill="#093829" fill-opacity="0.6" stroke="#059669" stroke-opacity="0.3"/>
  <circle cx="44" cy="37" r="4.5" fill="#ef4444" fill-opacity="0.8"/>
  <circle cx="58" cy="37" r="4.5" fill="#eab308" fill-opacity="0.8"/>
  <circle cx="72" cy="37" r="4.5" fill="#10b981" fill-opacity="0.8"/>
  <text x="94" y="41" fill="#a7f3d0" font-family="monospace" font-size="11" letter-spacing="1">CASION EV // CHARGING STATION TELEMETRY SYSTEM</text>
  <rect x="440" y="27" width="124" height="20" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
  <circle cx="452" cy="37" r="3" fill="#34d399"/>
  <text x="462" y="41" fill="#6ee7b7" font-family="monospace" font-size="9" font-weight="bold">STATION CS-088: LIVE</text>

  <!-- Left: Circular Battery & Supercharge Gauge -->
  <g transform="translate(50, 75)" filter="url(#ev-glow)">
    <rect width="250" height="185" rx="14" fill="#082b1f" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2"/>
    
    <!-- Outer Gauge Ring -->
    <circle cx="125" cy="85" r="58" stroke="#134e38" stroke-width="10" fill="none"/>
    <!-- Active Charging Ring (84%) -->
    <circle cx="125" cy="85" r="58" stroke="#10b981" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="364" stroke-dashoffset="65" transform="rotate(-90 125 85)"/>

    <!-- Lightning Bolt & Battery Icon -->
    <path d="M125 60 L115 82 H127 L122 105 L137 78 H125 Z" fill="#6ee7b7"/>

    <!-- Percentage Display -->
    <text x="125" y="152" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="900">84% CHARGED</text>
    <text x="125" y="168" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="10">Est. 12 mins remaining</text>
  </g>

  <!-- Right: Real-time Telemetry & Power Curve -->
  <g transform="translate(320, 75)">
    <!-- Power Output Card -->
    <rect width="240" height="88" rx="12" fill="#093527" stroke="#059669" stroke-opacity="0.35"/>
    <text x="18" y="24" fill="#6ee7b7" font-family="monospace" font-size="10" letter-spacing="1">POWER DELIVERY RATE</text>
    <text x="18" y="52" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">124.6 <tspan font-size="14" fill="#34d399">kW</tspan></text>
    <text x="18" y="70" fill="#a7f3d0" font-family="monospace" font-size="9">Current: 320A · Voltage: 390V DC</text>
    
    <!-- Mini Pulse Chart -->
    <path d="M160 52 L175 42 L190 48 L205 32 L220 38" stroke="#34d399" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Charging Connector Status -->
    <g transform="translate(0, 98)">
      <rect width="240" height="87" rx="12" fill="#093527" stroke="#059669" stroke-opacity="0.35"/>
      <text x="18" y="24" fill="#6ee7b7" font-family="monospace" font-size="10" letter-spacing="1">CONNECTOR TELEMETRY</text>
      <circle cx="26" cy="46" r="4" fill="#10b981"/>
      <text x="38" y="49" fill="#e2e8f0" font-family="monospace" font-size="10">CCS-2 Plug Interlock</text>
      <text x="195" y="49" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold">LOCKED</text>

      <circle cx="26" cy="68" r="4" fill="#34d399"/>
      <text x="38" y="71" fill="#e2e8f0" font-family="monospace" font-size="10">Thermal Sensor</text>
      <text x="195" y="71" fill="#34d399" font-family="monospace" font-size="9" font-weight="bold">31.4°C</text>
    </g>
  </g>

  <!-- Bottom Terminal Bar -->
  <rect x="24" y="280" width="552" height="38" rx="8" fill="#041f16" stroke="#059669" stroke-opacity="0.25"/>
  <text x="40" y="303" fill="#6ee7b7" font-family="monospace" font-size="10">> CASION // CV TECHNOPARTNER IOT TELEMETRY ACTIVE</text>
  <text x="500" y="303" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">● DISPATCHED</text>
</svg>
