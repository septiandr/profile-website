<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="behave-bg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#160824"/>
      <stop offset="50%" stop-color="#2a0d42"/>
      <stop offset="100%" stop-color="#0b0312"/>
    </linearGradient>
    <linearGradient id="behave-chart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="behave-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#a855f7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" rx="16" fill="url(#behave-bg)"/>
  
  <!-- Subtle Grid -->
  <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600" stroke="#a855f7" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M100 0 V340 M200 0 V340 M300 0 V340 M400 0 V340 M500 0 V340" stroke="#a855f7" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Window Header Bar -->
  <rect x="24" y="20" width="552" height="34" rx="8" fill="#32104f" fill-opacity="0.6" stroke="#9333ea" stroke-opacity="0.3"/>
  <circle cx="44" cy="37" r="4.5" fill="#ef4444" fill-opacity="0.8"/>
  <circle cx="58" cy="37" r="4.5" fill="#eab308" fill-opacity="0.8"/>
  <circle cx="72" cy="37" r="4.5" fill="#10b981" fill-opacity="0.8"/>
  <text x="94" y="41" fill="#e9d5ff" font-family="monospace" font-size="11" letter-spacing="1">BEHAVE.ID // ENTERPRISE PROMOTION & LOYALTY PLATFORM</text>
  <rect x="430" y="27" width="134" height="20" rx="10" fill="#a855f7" fill-opacity="0.2" stroke="#c084fc" stroke-opacity="0.4"/>
  <circle cx="442" cy="37" r="3" fill="#d8b4fe"/>
  <text x="452" y="41" fill="#f3e8ff" font-family="monospace" font-size="9" font-weight="bold">FLAGSHIP WORK 01</text>

  <!-- Main SaaS Dashboard Window -->
  <g transform="translate(40, 75)" filter="url(#behave-glow)">
    <rect width="520" height="190" rx="12" fill="#1e0b30" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.2"/>
    
    <!-- Left Column: Key Stats & Revenue Curve -->
    <g transform="translate(20, 18)">
      <text x="0" y="16" fill="#c084fc" font-family="monospace" font-size="10" letter-spacing="1">TOTAL TRANSACTION VOLUME</text>
      <text x="0" y="46" fill="#ffffff" font-family="sans-serif" font-size="26" font-weight="bold">$1,480,250</text>
      <text x="175" y="46" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">↑ +34.2%</text>

      <!-- Revenue Chart Area -->
      <g transform="translate(0, 58)">
        <path d="M0 65 Q 60 45, 120 50 T 240 15 L 240 70 L 0 70 Z" fill="url(#behave-chart)"/>
        <path d="M0 65 Q 60 45, 120 50 T 240 15" stroke="#c084fc" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <!-- Chart Points -->
        <circle cx="120" cy="50" r="4" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
        <circle cx="240" cy="15" r="4" fill="#ffffff" stroke="#c084fc" stroke-width="2"/>
        <!-- Date Markers -->
        <text x="0" y="85" fill="#a855f7" font-family="monospace" font-size="9">JAN</text>
        <text x="80" y="85" fill="#a855f7" font-family="monospace" font-size="9">FEB</text>
        <text x="160" y="85" fill="#a855f7" font-family="monospace" font-size="9">MAR</text>
        <text x="230" y="85" fill="#a855f7" font-family="monospace" font-size="9">APR</text>
      </g>
    </g>

    <!-- Divider Line -->
    <line x1="285" y1="20" x2="285" y2="175" stroke="#581c87" stroke-width="1"/>

    <!-- Right Column: Active Merchant & Voucher Modules -->
    <g transform="translate(305, 18)">
      <text x="0" y="16" fill="#c084fc" font-family="monospace" font-size="10" letter-spacing="1">LIVE ENTERPRISE MODULES</text>
      
      <!-- Module 1: Dynamic Voucher Engine -->
      <rect x="0" y="28" width="195" height="38" rx="8" fill="#2e104d" stroke="#7e22ce" stroke-width="1"/>
      <circle cx="16" cy="47" r="4" fill="#34d399"/>
      <text x="28" y="44" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Voucher Engine</text>
      <text x="28" y="58" fill="#d8b4fe" font-family="monospace" font-size="9">98,400 Redeemed</text>
      <text x="180" y="51" text-anchor="end" fill="#34d399" font-family="monospace" font-size="9">ACTIVE</text>

      <!-- Module 2: Merchant Portal CMS -->
      <rect x="0" y="74" width="195" height="38" rx="8" fill="#2e104d" stroke="#7e22ce" stroke-width="1"/>
      <circle cx="16" cy="93" r="4" fill="#c084fc"/>
      <text x="28" y="90" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Merchant Analytics</text>
      <text x="28" y="104" fill="#d8b4fe" font-family="monospace" font-size="9">142 Outlets Synced</text>
      <text x="180" y="97" text-anchor="end" fill="#c084fc" font-family="monospace" font-size="9">SYNCED</text>

      <!-- Module 3: Reservation Flow -->
      <rect x="0" y="120" width="195" height="38" rx="8" fill="#2e104d" stroke="#7e22ce" stroke-width="1"/>
      <circle cx="16" cy="139" r="4" fill="#f59e0b"/>
      <text x="28" y="136" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Table Booking Hub</text>
      <text x="28" y="150" fill="#d8b4fe" font-family="monospace" font-size="9">Real-time SMS & Push</text>
      <text x="180" y="143" text-anchor="end" fill="#f59e0b" font-family="monospace" font-size="9">READY</text>
    </g>
  </g>

  <!-- Bottom Terminal Bar -->
  <rect x="24" y="280" width="552" height="38" rx="8" fill="#130620" stroke="#7e22ce" stroke-opacity="0.25"/>
  <text x="40" y="303" fill="#d8b4fe" font-family="monospace" font-size="10">> BEHAVE // FULLSTACK SAAS CORE DEPLOYED & TESTED</text>
  <text x="500" y="303" fill="#c084fc" font-family="monospace" font-size="10" font-weight="bold">● PRODUCTION</text>
</svg>
