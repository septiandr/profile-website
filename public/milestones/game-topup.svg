<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="game-bg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#021f17"/>
      <stop offset="50%" stop-color="#053326"/>
      <stop offset="100%" stop-color="#01120d"/>
    </linearGradient>
    <filter id="game-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" rx="16" fill="url(#game-bg)"/>
  
  <!-- Subtle Grid -->
  <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600" stroke="#10b981" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M100 0 V340 M200 0 V340 M300 0 V340 M400 0 V340 M500 0 V340" stroke="#10b981" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Window Header Bar -->
  <rect x="24" y="20" width="552" height="34" rx="8" fill="#08382b" fill-opacity="0.6" stroke="#059669" stroke-opacity="0.3"/>
  <circle cx="44" cy="37" r="4.5" fill="#ef4444" fill-opacity="0.8"/>
  <circle cx="58" cy="37" r="4.5" fill="#eab308" fill-opacity="0.8"/>
  <circle cx="72" cy="37" r="4.5" fill="#10b981" fill-opacity="0.8"/>
  <text x="94" y="41" fill="#a7f3d0" font-family="monospace" font-size="11" letter-spacing="1">GAME TOP-UP // HIGH-THROUGHPUT MARKETPLACE & WHATSAPP BOT</text>
  <rect x="430" y="27" width="134" height="20" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-opacity="0.4"/>
  <circle cx="442" cy="37" r="3" fill="#6ee7b7"/>
  <text x="452" y="41" fill="#ecfdf5" font-family="monospace" font-size="9" font-weight="bold">FLAGSHIP WORK 03</text>

  <!-- Left: Instant Gaming Checkout Window -->
  <g transform="translate(40, 75)" filter="url(#game-glow)">
    <rect width="250" height="190" rx="12" fill="#062e22" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="18" y="26" fill="#6ee7b7" font-family="monospace" font-size="10" letter-spacing="1">INSTANT CHECKOUT MODAL</text>
    
    <!-- Game Icon & Tier -->
    <rect x="18" y="40" width="48" height="48" rx="10" fill="#0f513d" stroke="#34d399" stroke-width="1"/>
    <text x="42" y="70" text-anchor="middle" fill="#fef08a" font-size="20">⚔️</text>
    <text x="76" y="58" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Mobile Legends Bang Bang</text>
    <text x="76" y="74" fill="#a7f3d0" font-family="monospace" font-size="10">Zone ID: 2948 · User: 894102</text>

    <!-- Diamond Package Selected -->
    <rect x="18" y="98" width="214" height="38" rx="8" fill="#094131" stroke="#059669" stroke-width="1"/>
    <text x="28" y="116" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">💎 1,050 Diamonds + 150 Bonus</text>
    <text x="28" y="128" fill="#34d399" font-family="monospace" font-size="10">IDR 285,000</text>
    <rect x="162" y="106" width="62" height="22" rx="4" fill="#10b981"/>
    <text x="193" y="121" text-anchor="middle" fill="#042018" font-family="sans-serif" font-size="9" font-weight="900">PAID QRIS</text>

    <!-- Speed Telemetry -->
    <text x="18" y="160" fill="#6ee7b7" font-family="monospace" font-size="10">CREDIT FULFILLMENT: 1.8s</text>
    <rect x="18" y="168" width="214" height="6" rx="3" fill="#094131"/>
    <rect x="18" y="168" width="214" height="6" rx="3" fill="#34d399"/>
  </g>

  <!-- Right: Automated WhatsApp Delivery Bot Message Bubble -->
  <g transform="translate(310, 75)">
    <rect width="250" height="190" rx="12" fill="#062e22" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="18" y="26" fill="#6ee7b7" font-family="monospace" font-size="10" letter-spacing="1">WHATSAPP DISPATCH BOT</text>
    
    <!-- Bot Message Bubble -->
    <g transform="translate(18, 38)">
      <rect width="214" height="132" rx="10" fill="#094433" stroke="#22c55e" stroke-opacity="0.5" stroke-width="1"/>
      
      <!-- WA Header -->
      <circle cx="16" cy="18" r="7" fill="#22c55e"/>
      <path d="M13 18 L15 20 L19 16" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <text x="28" y="21" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">TopUp Bot (Verified)</text>
      <text x="198" y="21" text-anchor="end" fill="#86efac" font-family="monospace" font-size="9">14:02</text>

      <line x1="10" y1="32" x2="204" y2="32" stroke="#14532d" stroke-width="1"/>

      <!-- Message Text -->
      <text x="12" y="48" fill="#e2e8f0" font-family="sans-serif" font-size="10">Halo! Transaksi berhasil diproses:</text>
      <text x="12" y="66" fill="#6ee7b7" font-family="monospace" font-size="9">Token: MLBB-8910-TX-44</text>
      <text x="12" y="80" fill="#6ee7b7" font-family="monospace" font-size="9">Item: 1,200 Diamonds</text>
      <text x="12" y="94" fill="#6ee7b7" font-family="monospace" font-size="9">Status: SUCCESSFUL (0.4s)</text>

      <!-- Receipt Badge -->
      <rect x="12" y="104" width="100" height="18" rx="4" fill="#14532d"/>
      <text x="62" y="117" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="8">E-RECEIPT PDF ✓</text>
    </g>
  </g>

  <!-- Bottom Terminal Bar -->
  <rect x="24" y="280" width="552" height="38" rx="8" fill="#021c14" stroke="#059669" stroke-opacity="0.25"/>
  <text x="40" y="303" fill="#6ee7b7" font-family="monospace" font-size="10">> GAME TOPUP // GOLANG ASYNC WORKER + WHATSAPP ENGINE ACTIVE</text>
  <text x="500" y="303" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">● ZERO DROPS</text>
</svg>
