<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cimb-bg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#04121f"/>
      <stop offset="50%" stop-color="#071b2d"/>
      <stop offset="100%" stop-color="#02080e"/>
    </linearGradient>
    <linearGradient id="cimb-cyan-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cimb-card" x1="0" y1="0" x2="280" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e3a5a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#051c2e" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="cimb-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="340" rx="16" fill="url(#cimb-bg)"/>
  
  <!-- Subtle Grid Pattern -->
  <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600" stroke="#0ea5e9" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M100 0 V340 M200 0 V340 M300 0 V340 M400 0 V340 M500 0 V340" stroke="#0ea5e9" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Window Header Bar -->
  <rect x="24" y="20" width="552" height="34" rx="8" fill="#08233b" fill-opacity="0.6" stroke="#0284c7" stroke-opacity="0.25"/>
  <circle cx="44" cy="37" r="4.5" fill="#ef4444" fill-opacity="0.8"/>
  <circle cx="58" cy="37" r="4.5" fill="#eab308" fill-opacity="0.8"/>
  <circle cx="72" cy="37" r="4.5" fill="#10b981" fill-opacity="0.8"/>
  <text x="94" y="41" fill="#93c5fd" font-family="monospace" font-size="11" letter-spacing="1">CIMB NIAGA // E-DEBIT SECURE GATEWAY</text>
  <rect x="440" y="27" width="124" height="20" rx="10" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4"/>
  <circle cx="452" cy="37" r="3" fill="#06b6d4"/>
  <text x="462" y="41" fill="#67e8f9" font-family="monospace" font-size="9" font-weight="bold">AES-256 ACTIVE</text>

  <!-- Left: Digital E-Debit Card Mockup -->
  <g transform="translate(40, 80)" filter="url(#cimb-shadow)">
    <!-- Card Base -->
    <rect width="280" height="175" rx="14" fill="url(#cimb-card)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
    <!-- Holographic Wave -->
    <path d="M0 70 Q 70 40, 140 85 T 280 60 L 280 175 L 0 175 Z" fill="#0284c7" fill-opacity="0.15"/>
    <path d="M0 100 Q 80 80, 160 115 T 280 90 L 280 175 L 0 175 Z" fill="#06b6d4" fill-opacity="0.12"/>

    <!-- EMV Chip -->
    <rect x="24" y="26" width="38" height="28" rx="5" fill="#f59e0b" fill-opacity="0.8" stroke="#fcd34d" stroke-width="1"/>
    <path d="M24 40 H62 M43 26 V54" stroke="#b45309" stroke-width="1"/>

    <!-- Contactless Wave Icon -->
    <path d="M74 34 A 8 8 0 0 1 74 46 M80 30 A 14 14 0 0 1 80 50 M86 26 A 20 20 0 0 1 86 54" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Card Brand & Type -->
    <text x="256" y="44" text-anchor="end" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="900" letter-spacing="1">OCTO DEBIT</text>
    <text x="256" y="56" text-anchor="end" fill="#38bdf8" font-family="monospace" font-size="9" letter-spacing="1">PLATINUM TIER</text>

    <!-- Card Number -->
    <text x="24" y="112" fill="#e0f2fe" font-family="monospace" font-size="16" font-weight="600" letter-spacing="3">4201  ••••  ••••  8821</text>

    <!-- Cardholder & Expiry -->
    <text x="24" y="142" fill="#7dd3fc" font-family="monospace" font-size="8">CARDHOLDER</text>
    <text x="24" y="156" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="0.5">VERIFIED MEMBER</text>

    <text x="190" y="142" fill="#7dd3fc" font-family="monospace" font-size="8">VALID THRU</text>
    <text x="190" y="156" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">12/28</text>
  </g>

  <!-- Right: Real-time Telemetry & Security Stream -->
  <g transform="translate(345, 80)">
    <!-- Metric Panel 1: Live Volume -->
    <rect width="215" height="78" rx="10" fill="#082038" fill-opacity="0.7" stroke="#0ea5e9" stroke-opacity="0.3"/>
    <text x="16" y="24" fill="#7dd3fc" font-family="monospace" font-size="10" letter-spacing="1">DAILY TRANSACTION VOL</text>
    <text x="16" y="52" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold">IDR 248.5M</text>
    <path d="M140 50 L155 42 L170 46 L185 34 L200 38" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="16" y="68" fill="#10b981" font-family="monospace" font-size="9">+18.4% Latency: 42ms</text>

    <!-- Metric Panel 2: Security Handshake -->
    <g transform="translate(0, 92)">
      <rect width="215" height="83" rx="10" fill="#082038" fill-opacity="0.7" stroke="#0ea5e9" stroke-opacity="0.3"/>
      <text x="16" y="24" fill="#7dd3fc" font-family="monospace" font-size="10" letter-spacing="1">AUTHENTICATION STREAM</text>
      
      <circle cx="24" cy="46" r="4" fill="#10b981"/>
      <text x="36" y="49" fill="#e0f2fe" font-family="monospace" font-size="10">2FA Biometric Check</text>
      <text x="175" y="49" fill="#10b981" font-family="monospace" font-size="9">PASS</text>

      <circle cx="24" cy="66" r="4" fill="#06b6d4"/>
      <text x="36" y="69" fill="#e0f2fe" font-family="monospace" font-size="10">Tokenized Payload</text>
      <text x="175" y="69" fill="#06b6d4" font-family="monospace" font-size="9">SYNC</text>
    </g>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <rect x="24" y="280" width="552" height="38" rx="8" fill="#061826" stroke="#0284c7" stroke-opacity="0.2"/>
  <text x="40" y="303" fill="#67e8f9" font-family="monospace" font-size="10">> INFOSYS // CIMB NIAGA E-DEBIT ARCHITECTURE READY</text>
  <text x="500" y="303" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold">● ONLINE</text>
</svg>
