<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ddt-bg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f1404"/>
      <stop offset="50%" stop-color="#332007"/>
      <stop offset="100%" stop-color="#0e0801"/>
    </linearGradient>
    <linearGradient id="ddt-gold" x1="0" y1="0" x2="280" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="ddt-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" rx="16" fill="url(#ddt-bg)"/>
  
  <!-- Subtle Grid -->
  <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600" stroke="#f59e0b" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M100 0 V340 M200 0 V340 M300 0 V340 M400 0 V340 M500 0 V340" stroke="#f59e0b" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Window Header Bar -->
  <rect x="24" y="20" width="552" height="34" rx="8" fill="#38240a" fill-opacity="0.6" stroke="#b45309" stroke-opacity="0.3"/>
  <circle cx="44" cy="37" r="4.5" fill="#ef4444" fill-opacity="0.8"/>
  <circle cx="58" cy="37" r="4.5" fill="#eab308" fill-opacity="0.8"/>
  <circle cx="72" cy="37" r="4.5" fill="#10b981" fill-opacity="0.8"/>
  <text x="94" y="41" fill="#fde68a" font-family="monospace" font-size="11" letter-spacing="1">DDT & ZU POINT // MULTI-TIER REWARDS & REDEMPTION ENGINE</text>
  <rect x="440" y="27" width="124" height="20" rx="10" fill="#f59e0b" fill-opacity="0.2" stroke="#fbbf24" stroke-opacity="0.4"/>
  <circle cx="452" cy="37" r="3" fill="#f59e0b"/>
  <text x="462" y="41" fill="#fde68a" font-family="monospace" font-size="9" font-weight="bold">ATOMIC PIPELINE</text>

  <!-- Left: VIP Platinum Loyalty Pass -->
  <g transform="translate(40, 75)" filter="url(#ddt-glow)">
    <rect width="280" height="180" rx="14" fill="url(#ddt-gold)" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.2"/>
    
    <!-- Top Pass Header -->
    <text x="24" y="38" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="900" letter-spacing="1">ZU REWARDS</text>
    <text x="256" y="38" text-anchor="end" fill="#fde68a" font-family="monospace" font-size="10" font-weight="bold">BLACK TIER</text>

    <!-- Points Balance -->
    <text x="24" y="80" fill="#fef3c7" font-family="monospace" font-size="10">AVAILABLE BALANCE</text>
    <text x="24" y="112" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="900">4,850 <tspan font-size="14" fill="#fbbf24">PTS</tspan></text>

    <!-- Barcode / Redemption Token -->
    <rect x="24" y="132" width="232" height="32" rx="4" fill="#180e03" stroke="#92400e" stroke-width="1"/>
    <!-- Mock barcode stripes -->
    <g transform="translate(36, 138)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#fbbf24" stroke-width="2"/>
      <line x1="6" y1="0" x2="6" y2="20" stroke="#fbbf24" stroke-width="1"/>
      <line x1="12" y1="0" x2="12" y2="20" stroke="#fbbf24" stroke-width="3"/>
      <line x1="20" y1="0" x2="20" y2="20" stroke="#fbbf24" stroke-width="1"/>
      <line x1="26" y1="0" x2="26" y2="20" stroke="#fbbf24" stroke-width="2"/>
      <line x1="34" y1="0" x2="34" y2="20" stroke="#fbbf24" stroke-width="4"/>
      <line x1="44" y1="0" x2="44" y2="20" stroke="#fbbf24" stroke-width="1"/>
      <line x1="52" y1="0" x2="52" y2="20" stroke="#fbbf24" stroke-width="2"/>
      <line x1="60" y1="0" x2="60" y2="20" stroke="#fbbf24" stroke-width="3"/>
      <line x1="72" y1="0" x2="72" y2="20" stroke="#fbbf24" stroke-width="2"/>
      <line x1="80" y1="0" x2="80" y2="20" stroke="#fbbf24" stroke-width="1"/>
      <line x1="90" y1="0" x2="90" y2="20" stroke="#fbbf24" stroke-width="4"/>
    </g>
    <text x="244" y="153" text-anchor="end" fill="#fde68a" font-family="monospace" font-size="10">SCAN QR</text>
  </g>

  <!-- Right: Vouchers & Redemption Stream -->
  <g transform="translate(340, 75)">
    <!-- Active Voucher 1 -->
    <rect width="220" height="85" rx="12" fill="#3b260d" stroke="#b45309" stroke-opacity="0.4"/>
    <text x="16" y="24" fill="#fbbf24" font-family="monospace" font-size="10">VOUCHER #DDT-771</text>
    <text x="16" y="48" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">IDR 150,000 Off Dining</text>
    <rect x="16" y="58" width="105" height="18" rx="9" fill="#16a34a" fill-opacity="0.3" stroke="#22c55e" stroke-opacity="0.6"/>
    <text x="26" y="71" fill="#86efac" font-family="monospace" font-size="9" font-weight="bold">● READY TO REDEEM</text>

    <!-- Voucher 2 / Cash Flow -->
    <g transform="translate(0, 95)">
      <rect width="220" height="85" rx="12" fill="#3b260d" stroke="#b45309" stroke-opacity="0.4"/>
      <text x="16" y="24" fill="#fbbf24" font-family="monospace" font-size="10">TRANSACTION PIPELINE</text>
      <text x="16" y="48" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">99.98% <tspan font-size="11" fill="#86efac">SUCCESS</tspan></text>
      <text x="16" y="68" fill="#fde68a" font-family="monospace" font-size="9">Zero Double-Spend Guard Active</text>
    </g>
  </g>

  <!-- Bottom Terminal Bar -->
  <rect x="24" y="280" width="552" height="38" rx="8" fill="#1a1005" stroke="#b45309" stroke-opacity="0.25"/>
  <text x="40" y="303" fill="#fde68a" font-family="monospace" font-size="10">> DDT & ZU POINT // MULTI-TIER ENGINE LIVE IN PRODUCTION</text>
  <text x="500" y="303" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="bold">● VERIFIED</text>
</svg>
