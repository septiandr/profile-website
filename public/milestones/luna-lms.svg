    <text x="96" y="76" fill="#e0e7ff" font-family="monospace" font-size="9" font-weight="bold">ID: NAT-2023-902</text>

    <!-- Student Attendance & Engagement -->
    <g transform="translate(0, 108)">
      <rect width="210" height="77" rx="12" fill="#131940" stroke="#4f46e5" stroke-opacity="0.35"/>
      <text x="16" y="24" fill="#a5b4fc" font-family="monospace" font-size="10" letter-spacing="1">STUDENT RETENTION</text>
      <text x="16" y="50" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">96.8%</text>
      <text x="110" y="50" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold">↑ TOP TIER</text>
      <text x="16" y="67" fill="#818cf8" font-family="monospace" font-size="9">Active WebSockets: 1,280 msgs/s</text>
    </g>
  </g>

  <!-- Bottom Terminal Bar -->
  <rect x="24" y="280" width="552" height="38" rx="8" fill="#0c102a" stroke="#4f46e5" stroke-opacity="0.25"/>
  <text x="40" y="303" fill="#a5b4fc" font-family="monospace" font-size="10">> LUNA // NATIEVA GLOBAL SINARMAS PORTAL SYNCHRONIZED</text>
  <text x="500" y="303" fill="#818cf8" font-family="monospace" font-size="10" font-weight="bold">● ACTIVE</text>
