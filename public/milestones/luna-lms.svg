<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="luna-bg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0c24"/>
      <stop offset="50%" stop-color="#11163a"/>
      <stop offset="100%" stop-color="#050614"/>
    </linearGradient>
    <linearGradient id="luna-indigo-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="luna-progress" x1="0" y1="0" x2="1" y2="1">
