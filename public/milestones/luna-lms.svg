    <circle cx="36" cy="33" r="3" fill="#ffffff"/>
    <text x="44" y="36" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">● REC</text>

    <text x="264" y="37" text-anchor="end" fill="#c7d2fe" font-family="monospace" font-size="10">HD 1080P</text>

    <!-- Bottom Lesson Title & Progress Bar -->
    <text x="16" y="145" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Module 04: Advanced Cloud Architecture</text>
    <rect x="16" y="158" width="258" height="6" rx="3" fill="#232a5c"/>
    <rect x="16" y="158" width="220" height="6" rx="3" fill="url(#luna-progress)"/>
    <text x="16" y="176" fill="#a5b4fc" font-family="monospace" font-size="9">Progress: 88% Complete · Next: Final Assessment</text>
  </g>

  <!-- Right: Certificate & Student Engagement Metrics -->
  <g transform="translate(350, 75)">
    <!-- Certification Completion Badge Card -->
    <rect width="210" height="98" rx="12" fill="#131940" stroke="#4f46e5" stroke-opacity="0.35"/>
    <circle cx="45" cy="50" r="26" fill="#202863" stroke="#818cf8" stroke-width="2"/>
    <!-- Laurel Wreath & Star -->
