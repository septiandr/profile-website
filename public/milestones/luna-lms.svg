  </defs>

  <!-- Background -->
  <rect width="600" height="340" rx="16" fill="url(#luna-bg)"/>
  
  <!-- Subtle Grid -->
  <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600" stroke="#6366f1" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M100 0 V340 M200 0 V340 M300 0 V340 M400 0 V340 M500 0 V340" stroke="#6366f1" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Window Header Bar -->
  <rect x="24" y="20" width="552" height="34" rx="8" fill="#151b47" fill-opacity="0.6" stroke="#4f46e5" stroke-opacity="0.3"/>
  <circle cx="44" cy="37" r="4.5" fill="#ef4444" fill-opacity="0.8"/>
  <circle cx="58" cy="37" r="4.5" fill="#eab308" fill-opacity="0.8"/>
  <circle cx="72" cy="37" r="4.5" fill="#10b981" fill-opacity="0.8"/>
  <text x="94" y="41" fill="#c7d2fe" font-family="monospace" font-size="11" letter-spacing="1">LUNA SINARMAS // LIVE LEARNING & CERTIFICATION LMS</text>
  <rect x="440" y="27" width="124" height="20" rx="10" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-opacity="0.4"/>
  <circle cx="452" cy="37" r="3" fill="#a5b4fc"/>
  <text x="462" y="41" fill="#e0e7ff" font-family="monospace" font-size="9" font-weight="bold">1,280 STUDENTS LIVE</text>

  <!-- Left: Live Class Stream Window -->
