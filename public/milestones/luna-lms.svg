    <!-- Sound Waves / Audio Visualizer -->
    <g transform="translate(30, 75)">
      <line x1="0" y1="0" x2="0" y2="-20" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
      <line x1="12" y1="0" x2="12" y2="-32" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round"/>
      <line x1="24" y1="0" x2="24" y2="-14" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
      <line x1="36" y1="0" x2="36" y2="-45" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
      <line x1="48" y1="0" x2="48" y2="-28" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
      <line x1="60" y1="0" x2="60" y2="-18" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round"/>
      <line x1="72" y1="0" x2="72" y2="-38" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
      <line x1="84" y1="0" x2="84" y2="-22" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
      <line x1="96" y1="0" x2="96" y2="-12" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Live indicator badge -->
